<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公募中の依頼 | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="open-requests.html" data-role-theme="instructor">

<div id="site-header"></div>

<main class="mypage" id="openRequestsMain">
  <!-- JSで動的に描画 -->
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  const FORMAT_LABEL = { online: "オンライン", offline: "対面", both: "オンライン・対面" };
  const HIDDEN_KEY = "kenshulink_hidden_open_requests"; // localStorage: 「興味なし」で非表示にした request_id の配列（これは端末ローカルのままでよい機能のため localStorage 継続）

  // 「あなたにおすすめ」判定用：講師プロフィール（専門分野ID・対応形態・最低単価）
  let myProfile = null; // { workStyle, desiredRateMin, expertiseIds: Set }

  // request（案件）が講師プロフィールと「1つでも」条件が合えばマッチとみなす（OR条件）。
  // ディレクターの指示により、分野／形態／予算のいずれか1つでも合致すればヒットとする。
  function matchReasons(r) {
    if (!myProfile) return [];
    const reasons = [];
    if (r.expertise_field && myProfile.expertiseIds.has(r.expertise_field)) reasons.push("分野");
    const formatOk =
      r.preferred_format === "both" ||
      (r.preferred_format === "online" && (myProfile.workStyle === "ONLINE" || myProfile.workStyle === "HYBRID")) ||
      (r.preferred_format === "offline" && (myProfile.workStyle === "ONSITE" || myProfile.workStyle === "HYBRID"));
    if (formatOk) reasons.push("形態");
    if (r.budget != null && myProfile.desiredRateMin != null && r.budget >= myProfile.desiredRateMin) reasons.push("予算");
    return reasons;
  }

  // 「あなたにおすすめ」判定：分野が合致していれば無条件でヒット。
  // 分野が合致しない場合は、形態・予算のうち2つ以上合致していればヒットとする
  // （形態や予算だけ偶然一致しただけの、関連性の低い案件が並ぶのを防ぐため）。
  function isRecommended(reasons) {
    return reasons.includes("分野") || reasons.length >= 2;
  }

  async function loadMyProfileForMatching(user) {
    const { data: profile } = await supabaseClient
      .from("instructor_profiles")
      .select("work_style, desired_rate_min")
      .eq("id", user.id)
      .maybeSingle();
    const { data: expertiseRows } = await supabaseClient
      .from("instructor_expertise")
      .select("subcategory_id")
      .eq("instructor_id", user.id);
    myProfile = {
      workStyle: profile?.work_style || null,
      desiredRateMin: profile?.desired_rate_min ?? null,
      expertiseIds: new Set((expertiseRows || []).map(x => x.subcategory_id)),
    };
  }

  // XSS対策: DBから来た値（title/description/location等、ユーザー入力由来）を
  // innerHTML に差し込む前に必ずこの関数を通す。特にこのページは未ログインでも
  // 閲覧できるため、影響範囲がログイン済みユーザーだけに留まらない点に注意。
  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  async function markResultsSeen(responseIds) {
    if (!responseIds.length) return;
    const { error } = await supabaseClient
      .from("instructor_responses")
      .update({ result_seen_at: new Date().toISOString() })
      .in("response_id", responseIds)
      .is("result_seen_at", null);
    if (error) console.error("markResultsSeen error:", error);
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  }

  function getHiddenIds() {
    try { return JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []; }
    catch { return []; }
  }

  /* --- 未ログイン時：基本情報だけのプレビュー一覧（連絡先・応募操作なし） ---
     各カードの「詳細を見る」から request-detail.html に遷移し、そちらで
     ログインゲート（応募操作時のみログインを促す）を行う。 */
  async function renderPublicPreview() {
    const root = document.getElementById("openRequestsMain");
    root.innerHTML = `
      <div class="mypage__head">
        <h1 class="mypage__title">公募中の依頼</h1>
        <p class="mypage__role">企業・個人から寄せられている依頼の一覧です（詳細の閲覧・応募には講師アカウントでのログインが必要です）</p>
      </div>
      <div id="requestList"><p style="color:var(--color-ink-soft); font-size:13px;">読み込み中…</p></div>
    `;

    const { data, error } = await supabaseClient
      .from("open_requests_public_preview")
      .select("*")
      .order("created_at", { ascending: false });

    const listEl = document.getElementById("requestList");
    if (error) {
      listEl.innerHTML = `<p style="color:var(--color-danger); font-size:13px;">読み込みエラー：${error.message}</p>`;
      return;
    }

    if (!data || data.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><p class="empty-state__title">現在、公募中の依頼はありません</p></div>`;
      return;
    }

    listEl.innerHTML = data.map(r => `
      <div class="request-card">
        <div class="request-card__top">
          <div>
            <div class="request-card__title">${escapeHtml(r.title)}</div>
            <div class="request-card__meta">
              <span>${r.requester_type === "company" ? "企業" : "生徒"}からの公募</span>
              <span>${fmtDate(r.created_at)}</span>
            </div>
          </div>
          <span class="status-badge status-badge--pending">募集中</span>
        </div>
        <p class="request-card__desc">${escapeHtml(r.description)}</p>
        <div class="request-card__tags">
          <span class="instructor-card__tag">${FORMAT_LABEL[r.preferred_format] || escapeHtml(r.preferred_format)}</span>
          ${r.budget ? `<span class="instructor-card__tag">予算 ¥${Number(r.budget).toLocaleString()}</span>` : ""}
          ${r.location ? `<span class="instructor-card__tag">${escapeHtml(r.location)}</span>` : ""}
        </div>
        <div class="request-card__actions">
          <a href="request-detail.html?id=${escapeHtml(r.request_id)}" class="btn btn--primary btn--sm">詳細を見る</a>
        </div>
      </div>
    `).join("");
  }

  /* --- ログイン状態／ロールのチェック --- */
  function renderGate(kind) {
    const main = document.getElementById("openRequestsMain");
    if (kind === "not-instructor") {
      main.innerHTML = `
        <div class="empty-state" style="padding-top:80px;">
          <p class="empty-state__title">講師アカウントのみご利用いただけます</p>
          <p class="empty-state__desc">公募中の依頼への応募は、講師アカウントでログインした場合のみ利用できます。</p>
          <a href="mypage.html" class="btn btn--primary" style="margin-top:16px;">マイページに戻る</a>
        </div>
      `;
    }
  }

  let currentTab = "recommended"; // recommended: あなたにおすすめ / open: 応募可能 / mine: 自分が応募済み
  let allRequests = [];
  let requesterMap = {};
  let user = null;

  async function main() {
    if (!authReady) {
      await new Promise(resolve => document.addEventListener("kenshulink:authchange", resolve, { once: true }));
    }
    user = getCurrentUser();

    // ⚠️ FIX: 以前は未ログイン時に一覧を一切見せず、ログインを強制していた。
    // instructors.html（企業・個人が講師を探す側）と同じ体験にするため、
    // 未ログインでも基本情報だけのプレビューを見せ、詳細閲覧・応募の
    // アクション時にだけログインを促す方式に変更。
    if (!user) { await renderPublicPreview(); return; }
    if (user.role !== "INSTRUCTOR") { renderGate("not-instructor"); return; }

    await loadMyProfileForMatching(user);

    const root = document.getElementById("openRequestsMain");
    root.innerHTML = `
      <div class="mypage__head">
        <h1 class="mypage__title">公募中の依頼</h1>
        <p class="mypage__role">特定の講師を指定せずに募集されている依頼の一覧です</p>
      </div>
      <div class="status-tabs" id="statusTabs"></div>
      <div id="requestList"><p style="color:var(--color-ink-soft); font-size:13px;">読み込み中…</p></div>
    `;

    // target_instructor_id が NULL の依頼＝公募依頼のみ対象（status='cancelled' は除外）
    const { data, error } = await supabaseClient
      .from("training_requests")
      .select("*, instructor_responses(*), training_reviews(*)")
      .is("target_instructor_id", null)
      .neq("status", "cancelled")
      .order("created_at", { ascending: false });

    const listEl = document.getElementById("requestList");
    if (error) {
      listEl.innerHTML = `<p style="color:var(--color-danger); font-size:13px;">読み込みエラー：${error.message}</p>`;
      return;
    }

    allRequests = (data || []).map(r => ({
      ...r,
      myResponse: (r.instructor_responses || []).find(x => x.instructor_id === user.id) || null,
    }));

    // 「応募終了（選ばれなかった）」の依頼を、このページを開いた時点で確認済みとしてマーク
    // → マイページのバッジ通知が消える（DB に保存するため、別端末でも反映される）
    const notSelectedResponseIds = allRequests
      .filter(r => r.status === "accepted" && r.myResponse && !r.myResponse.is_selected)
      .map(r => r.myResponse.response_id);
    await markResultsSeen(notSelectedResponseIds);

    // 自分が選ばれた（accepted かつ is_selected）依頼だけ、依頼者の連絡先を取得
    const selectedRequesterIds = allRequests
      .filter(r => r.status === "accepted" && r.myResponse?.is_selected)
      .map(r => r.requester_id);

    requesterMap = {};
    if (selectedRequesterIds.length) {
      const { data: requesters } = await supabaseClient.from("users").select("id, name, email").in("id", selectedRequesterIds);
      requesters?.forEach(u => { requesterMap[u.id] = u; });
      const { data: requesterProfiles } = await supabaseClient.from("requester_profiles").select("*").in("id", selectedRequesterIds);
      requesterProfiles?.forEach(p => { requesterMap[p.id] = { ...requesterMap[p.id], ...p }; });
    }

    const tabs = [
      ["recommended", "あなたにおすすめ"],
      ["open", "応募可能"],
      ["mine", "応募済み"],
    ];
    document.getElementById("statusTabs").innerHTML = tabs.map(([key, label]) => {
      const count = key === "open" ? countOpen() : key === "mine" ? countMine() : countRecommended();
      return `<button type="button" class="status-tab ${key === currentTab ? "is-active" : ""}" data-tab="${key}">${label}<span class="status-tab__count">(${count})</span></button>`;
    }).join("");

    document.querySelectorAll("#statusTabs .status-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll("#statusTabs .status-tab").forEach(b => b.classList.toggle("is-active", b === btn));
        renderList();
      });
    });

    renderList();
  }

  function countOpen() {
    const hidden = getHiddenIds();
    return allRequests.filter(r => r.status === "pending" && !r.myResponse && !hidden.includes(r.request_id)).length;
  }
  function countMine() {
    return allRequests.filter(r => r.myResponse).length;
  }
  function countRecommended() {
    const hidden = getHiddenIds();
    return allRequests.filter(r => r.status === "pending" && !r.myResponse && !hidden.includes(r.request_id) && matchReasons(r).length > 0).length;
  }

  function displayStatus(r) {
    if (r.status === "completed") return { key: "completed", label: "完了" };
    if (r.status === "accepted") {
      return r.myResponse?.is_selected
        ? { key: "selected", label: "あなたに決定" }
        : { key: "not-selected", label: "応募終了" };
    }
    if (r.myResponse) {
      if (r.myResponse.action === "reject" || r.myResponse.action === "withdrawn") return { key: "rejected", label: "却下済み" };
      return { key: "quoted", label: "返信済み（依頼者の確定待ち）" };
    }
    return { key: "pending", label: "募集中" };
  }

  function renderList() {
    const listEl = document.getElementById("requestList");
    const hidden = getHiddenIds();

    let filtered;
    if (currentTab === "recommended") {
      filtered = allRequests
        .filter(r => r.status === "pending" && !r.myResponse && !hidden.includes(r.request_id) && matchReasons(r).length > 0)
        .sort((a, b) => {
          const ra = matchReasons(a), rb = matchReasons(b);
          const strongDiff = (isRecommended(rb) ? 1 : 0) - (isRecommended(ra) ? 1 : 0);
          if (strongDiff !== 0) return strongDiff; // 分野一致 or 2件以上一致 を優先
          return rb.length - ra.length;
        });
    } else if (currentTab === "open") {
      filtered = allRequests.filter(r => r.status === "pending" && !r.myResponse && !hidden.includes(r.request_id));
    } else {
      filtered = allRequests.filter(r => r.myResponse);
    }

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <p class="empty-state__title">${currentTab === "recommended" ? "現在、あなたにおすすめの案件はありません" : currentTab === "open" ? "現在、応募可能な公募依頼はありません" : "まだ応募した公募依頼はありません"}</p>
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map(r => {
      const st = displayStatus(r);
      const reasons = currentTab === "recommended" ? matchReasons(r) : [];
      return `
      <div class="request-card" data-id="${escapeHtml(r.request_id)}">
        <div class="request-card__top">
          <div>
            <div class="request-card__title">${escapeHtml(r.title)}</div>
            <div class="request-card__meta">
              <span>${r.requester_type === "company" ? "企業" : "生徒"}からの公募</span>
              <span>${fmtDate(r.created_at)}</span>
            </div>
          </div>
          <span class="status-badge status-badge--${st.key === "quoted" ? "quoted" : st.key === "rejected" ? "rejected" : st.key === "not-selected" ? "rejected" : st.key === "selected" ? "accepted" : st.key}">${st.label}</span>
        </div>

        ${reasons.length ? `<div class="notice-banner ${isRecommended(reasons) ? "is-visible" : ""}" style="margin-bottom:10px; font-size:12.5px; ${isRecommended(reasons) ? "" : "opacity:.65; background:var(--color-bg);"}">あなたの${reasons.join("・")}と合致しています</div>` : ""}

        <p class="request-card__desc">${escapeHtml(r.description)}</p>
        <div class="request-card__tags">
          <span class="instructor-card__tag">${FORMAT_LABEL[r.preferred_format] || escapeHtml(r.preferred_format)}</span>
          ${r.budget ? `<span class="instructor-card__tag">予算 ¥${Number(r.budget).toLocaleString()}</span>` : ""}
          ${r.location ? `<span class="instructor-card__tag">${escapeHtml(r.location)}</span>` : ""}
          ${r.preferred_schedule ? `<span class="instructor-card__tag">${escapeHtml(r.preferred_schedule)}</span>` : ""}
        </div>

        ${r.myResponse ? `
          <div class="request-card__response">
            <strong>あなたの対応：${r.myResponse.action === "accept" ? "承諾" : r.myResponse.action === "quote" ? `見積り ¥${Number(r.myResponse.quote_price || 0).toLocaleString()}` : "却下"}</strong>
            ${r.myResponse.message ? escapeHtml(r.myResponse.message) : "（メッセージなし）"}
          </div>
        ` : ""}

        ${!r.myResponse && r.status === "pending" ? `
          <div class="request-card__actions">
            <a href="request-detail.html?id=${escapeHtml(r.request_id)}&focus=respond" class="btn btn--primary btn--sm">応募する</a>
            <a href="request-detail.html?id=${escapeHtml(r.request_id)}" class="btn btn--ghost btn--sm">詳細を見る</a>
          </div>
        ` : ""}

        ${st.key === "selected" ? `
          <div class="contact-box">
            <strong>連絡先：</strong>
            ${requesterMap[r.requester_id] ? `
              <div>${requesterMap[r.requester_id].company_name ? "会社名：" + escapeHtml(requesterMap[r.requester_id].company_name) : "担当者：" + escapeHtml(requesterMap[r.requester_id].name)}</div>
              <div>メール：${escapeHtml(requesterMap[r.requester_id].email)}</div>
              <div>電話番号：${escapeHtml(requesterMap[r.requester_id].phone) || "未登録"}</div>
            ` : "読み込み中…"}
          </div>
          <p class="request-card__desc" style="color:var(--color-ink-soft);">この依頼はあなたに決定しました。マイページの「受け取った依頼」からは表示されないため、進捗はこのページで確認してください。</p>
        ` : ""}
      </div>
    `;
    }).join("");

    // hide/accept/reject/quote 系のアクションは request-detail.html に移動したため、
    // 一覧のカードにはイベントハンドラ不要（応募する・詳細を見るは通常の <a> リンク）。
  }

  document.addEventListener("kenshulink:authchange", main);
  main();
</script>
</body>
</html>
