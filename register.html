<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録 | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="register.html">

<div id="site-header"></div>

<main class="auth-page">
  <div class="auth-card">

    <!-- ステップインジケーター（波紋バッジ） -->
    <div class="step-track" id="stepTrack">
      <div class="step-track__item is-active" data-step-item="1">
        <span class="hanko hanko--step is-active" data-step-mark="1">一</span>
        <span class="step-track__label">役割を選択</span>
      </div>
      <div class="step-track__line"></div>
      <div class="step-track__item" data-step-item="2">
        <span class="hanko hanko--step" data-step-mark="2">二</span>
        <span class="step-track__label">アカウント情報</span>
      </div>
    </div>

    <!-- ===================== STEP 1：役割選択 ===================== -->
    <section id="step1">
      <p class="auth-card__eyebrow">STEP 1 / 2</p>
      <h1 class="auth-card__title">どちらの立場で登録しますか？</h1>
      <p class="auth-card__desc">選択した役割に応じて、後ほど入力いただく項目が変わります。</p>

      <div class="role-grid">
        <button type="button" class="role-card" data-role="instructor">
          <span class="hanko hanko--role" aria-hidden="true">講</span>
          <span class="role-card__name">研修講師</span>
          <span class="role-card__desc">研修サービスを提供する。プロフィールを公開して依頼を受ける。</span>
        </button>

        <button type="button" class="role-card" data-role="business">
          <span class="hanko hanko--role" aria-hidden="true">企</span>
          <span class="role-card__name">企業</span>
          <span class="role-card__desc">自社の研修ニーズに合う講師を探し、依頼を送る。</span>
        </button>

        <button type="button" class="role-card" data-role="individual">
          <span class="hanko hanko--role" aria-hidden="true">生</span>
          <span class="role-card__name">生徒</span>
          <span class="role-card__desc">生徒として学びたい分野の講師を探し、依頼を送る。</span>
        </button>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn--primary btn--block" id="toStep2" disabled>
          次へ進む
        </button>
      </div>
    </section>

    <!-- ===================== STEP 2：アカウント情報 ===================== -->
    <section id="step2" style="display:none;">
      <p class="auth-card__eyebrow" id="step2Eyebrow">STEP 2 / 2</p>
      <h1 class="auth-card__title">アカウント情報を入力</h1>
      <p class="auth-card__desc" id="step2Desc">メールアドレスとパスワードを設定してください。</p>

      <div class="notice-banner" id="formError">
        入力内容をご確認ください。
      </div>

      <form id="registerForm" novalidate>
        <div class="form-field">
          <label for="displayName" id="displayNameLabel">お名前</label>
          <input type="text" id="displayName" name="displayName" placeholder="山田 太郎" required>
          <p class="form-field__error">お名前を入力してください。</p>
        </div>

        <div id="businessExtraFields" style="display:none;">
          <div class="form-field">
            <label for="website">企業のホームページ（任意）</label>
            <input type="text" id="website" placeholder="https://example.com">
          </div>
          <div class="form-field">
            <label for="phone">電話番号（任意）</label>
            <input type="text" id="phone" placeholder="090-xxxx-xxxx">
          </div>
          <div class="form-field">
            <label for="address">住所（任意）</label>
            <input type="text" id="address" placeholder="例：東京都渋谷区...">
          </div>
        </div>

        <div class="form-field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          <p class="form-field__error">メールアドレスを正しく入力してください。</p>
        </div>

        <div class="form-field">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8" autocomplete="new-password">
          <p class="form-field__hint">半角英数字を組み合わせて8文字以上で設定してください。</p>
          <p class="form-field__error">パスワードは8文字以上で入力してください。</p>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn--ghost" id="backToStep1">戻る</button>
          <button type="submit" class="btn btn--primary btn--block">アカウントを作成</button>
        </div>
      </form>

      <div class="divider">または</div>

      <button type="button" class="btn btn--google" id="googleAuth">
        Googleで登録する
      </button>
    </section>

    <p class="auth-switch">
      すでにアカウントをお持ちですか？ <a href="login.html">ログイン</a>
    </p>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  const ROLE_LABELS = {
    instructor: { name: "研修講師", desc: "研修講師として、プロフィールに掲載する情報を次のステップで入力します。" },
    business:   { name: "企業",     desc: "企業アカウントとして、会社情報を次のステップで入力します。" },
    individual: { name: "生徒",     desc: "生徒アカウントとして、基本情報を次のステップで入力します。" },
  };

  let selectedRole = null;

  const roleCards = document.querySelectorAll(".role-card");
  const toStep2Btn = document.getElementById("toStep2");
  const backToStep1Btn = document.getElementById("backToStep1");
  const step1 = document.getElementById("step1");
  const step2 = document.getElementById("step2");
  const step2Eyebrow = document.getElementById("step2Eyebrow");
  const step2Desc = document.getElementById("step2Desc");

  roleCards.forEach(card => {
    card.addEventListener("click", () => {
      roleCards.forEach(c => c.classList.remove("is-selected"));
      card.classList.add("is-selected");
      selectedRole = card.dataset.role;
      toStep2Btn.disabled = false;
    });
  });

  function goToStep(stepNumber) {
    document.querySelectorAll("[data-step-item]").forEach(item => {
      const n = Number(item.dataset.stepItem);
      item.classList.toggle("is-active", n === stepNumber);
      item.classList.toggle("is-done", n < stepNumber);
      const mark = item.querySelector("[data-step-mark]");
      mark.classList.toggle("is-active", n === stepNumber);
      mark.classList.toggle("is-done", n < stepNumber);
    });
    step1.style.display = stepNumber === 1 ? "block" : "none";
    step2.style.display = stepNumber === 2 ? "block" : "none";
  }

  toStep2Btn.addEventListener("click", () => {
    if (!selectedRole) return;
    const role = ROLE_LABELS[selectedRole];
    step2Eyebrow.textContent = `STEP 2 / 2 — ${role.name}として登録`;
    step2Desc.textContent = role.desc;
    const nameLabel = document.getElementById("displayNameLabel");
    const nameInput = document.getElementById("displayName");
    if (selectedRole === "business") {
      nameLabel.textContent = "会社名";
      nameInput.placeholder = "株式会社サンプル";
      document.getElementById("businessExtraFields").style.display = "block";
    } else {
      nameLabel.textContent = "お名前";
      nameInput.placeholder = selectedRole === "instructor" ? "田中 陽子" : "山田 太郎";
      document.getElementById("businessExtraFields").style.display = "none";
    }
    goToStep(2);
  });

  backToStep1Btn.addEventListener("click", () => goToStep(1));

  // Supabase／ネットワークの生エラーを、そのままユーザーに見せないための変換関数。
  // 該当しないエラーは原因不明のまま英語メッセージを見せるよりはマシな汎用文言にする。
  function friendlyErrorMessage(error) {
    const msg = error?.message || "";
    if (msg.includes("already registered") || msg.includes("User already registered")) {
      return "このメールアドレスはすでに登録されています。ログインをお試しください。";
    }
    if (msg.includes("Failed to fetch") || msg.includes("NetworkError") || msg.includes("network")) {
      return "通信エラーが発生しました。ネットワーク環境をご確認のうえ、もう一度お試しください。";
    }
    if (msg.includes("Password should be at least") || msg.includes("password")) {
      return "パスワードは8文字以上で入力してください。";
    }
    return "登録に失敗しました。時間をおいてもう一度お試しください。";
  }

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nameField = document.getElementById("displayName").closest(".form-field");
    const emailField = document.getElementById("email").closest(".form-field");
    const passwordField = document.getElementById("password").closest(".form-field");
    const displayName = document.getElementById("displayName").value.trim();
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    let hasError = false;
    nameField.classList.toggle("has-error", displayName.length === 0);
    emailField.classList.toggle("has-error", !email.includes("@"));
    passwordField.classList.toggle("has-error", password.length < 8);
    if (displayName.length === 0 || !email.includes("@") || password.length < 8) hasError = true;

    const errorBanner = document.getElementById("formError");
    errorBanner.textContent = "入力内容をご確認ください。";
    errorBanner.classList.toggle("is-visible", hasError);
    if (hasError) return;

    const dbRole = ROLE_CARD_TO_DB[selectedRole];
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "登録中…";

    const { data, error } = await signUpAccount(email, password, dbRole, displayName);

    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;

    if (error) {
      errorBanner.textContent = friendlyErrorMessage(error);
      errorBanner.classList.add("is-visible");
      return;
    }

    if (data?.session) {
      // メール確認が不要な設定の場合：そのままログイン状態になる
      if (selectedRole === "business") {
        await supabaseClient.from("requester_profiles").upsert({
          id: data.session.user.id,
          company_name: displayName,
          website: document.getElementById("website").value.trim() || null,
          phone: document.getElementById("phone").value.trim() || null,
          address: document.getElementById("address").value.trim() || null,
        }, { onConflict: "id" });
      }
      showToast(`${ROLE_LABELS[selectedRole].name} として登録しました`);
      setTimeout(() => { window.location.href = "mypage.html"; }, 700);
    } else {
      // メール確認が必要な設定の場合：確認後にログインしてもらう
      errorBanner.classList.remove("is-visible");
      step2.innerHTML = `
        <p class="auth-card__eyebrow">STEP 2 / 2</p>
        <h1 class="auth-card__title">確認メールを送信しました</h1>
        <p class="auth-card__desc">${email} 宛に確認メールを送信しました。メール内のリンクをクリックしてから、ログインページでログインしてください。</p>
        <a href="login.html" class="btn btn--primary btn--block">ログインページへ</a>
      `;
    }
  });

  document.getElementById("googleAuth").addEventListener("click", async () => {
    const btn = document.getElementById("googleAuth");
    btn.disabled = true;
    btn.textContent = "リダイレクト中…";

    // 役割の選択は Google 認証の「後」に complete-profile.html で行う
    // （auth.js が public.users に行が無いことを検知して自動的にそちらへ誘導する）。
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: `${window.location.origin}${window.location.pathname.replace(/register\.html$/, "")}mypage.html`,
      },
    });

    if (error) {
      showToast(`エラー：${friendlyErrorMessage(error)}`);
      btn.disabled = false;
      btn.textContent = "Googleで登録する";
    }
  });
</script>
</body>
</html>
