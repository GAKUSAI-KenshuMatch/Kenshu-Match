<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール編集 | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="mypage.html" data-role-theme="business">

<div id="site-header"></div>

<main class="auth-page" style="align-items:flex-start; padding-top:40px;">
  <div class="auth-card" style="max-width:560px;" id="profileCard">
    <p class="auth-card__eyebrow">REQUESTER PROFILE</p>
    <h1 class="auth-card__title" id="pageTitle">プロフィール</h1>
    <p class="auth-card__desc">
      ここで入力した電話番号・会社情報は、依頼が承諾され連絡先が開示された後にのみ講師に共有されます。
    </p>

    <div class="notice-banner" id="profileError">入力内容をご確認ください。</div>
    <div id="profileFormWrap">
      <p style="color:var(--color-ink-soft); font-size:13px;">読み込み中…</p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  const wrap = document.getElementById("profileFormWrap");
  const errorBanner = document.getElementById("profileError");

  function formHtml(p, isCompany, fallbackName) {
    p = p || {};
    return `
      <form id="profileForm" novalidate>
        ${isCompany ? `
        <div class="form-field">
          <label for="companyName">会社名</label>
          <input type="text" id="companyName" placeholder="株式会社サンプル" value="${p.company_name || fallbackName || ""}">
        </div>
        <div class="form-field">
          <label for="website">企業のホームページ（任意）</label>
          <input type="text" id="website" placeholder="https://example.com" value="${p.website || ""}">
        </div>
        ` : ""}

        <div class="form-field">
          <label for="phone">電話番号</label>
          <input type="text" id="phone" placeholder="090-xxxx-xxxx" value="${p.phone || ""}">
        </div>

        <div class="form-field">
          <label for="address">住所（任意）</label>
          <input type="text" id="address" placeholder="例：東京都渋谷区..." value="${p.address || ""}">
        </div>

        <div class="form-field">
          <label for="notes">備考（任意）</label>
          <textarea id="notes" rows="3" placeholder="研修担当としての補足事項があればご記入ください">${p.notes || ""}</textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary btn--block">保存する</button>
        </div>
      </form>
    `;
  }

  async function init() {
    if (!authReady) {
      await new Promise(resolve => document.addEventListener("kenshulink:authchange", resolve, { once: true }));
    }
    const user = getCurrentUser();

    if (!user) {
      wrap.innerHTML = `<p style="font-size:13px;">プロフィールを編集するにはログインしてください。 <a href="login.html" style="color:var(--color-primary); font-weight:700;">ログイン</a></p>`;
      return;
    }
    if (user.role !== "COMPANY" && user.role !== "INDIVIDUAL") {
      wrap.innerHTML = `<p style="font-size:13px;">このページは企業・個人アカウントのみ利用できます。</p><a href="mypage.html" class="btn btn--ghost" style="margin-top:12px;">マイページへ戻る</a>`;
      return;
    }

    const isCompany = user.role === "COMPANY";
    document.getElementById("pageTitle").textContent = isCompany ? "企業プロフィール" : "生徒プロフィール";

    const { data: profile, error: fetchError } = await supabaseClient
      .from("requester_profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    if (fetchError) {
      wrap.innerHTML = `<p style="color:var(--color-danger); font-size:13px;">読み込みエラー：${fetchError.message}</p>`;
      return;
    }

    wrap.innerHTML = formHtml(profile, isCompany, user.name);

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBanner.classList.remove("is-visible");

      const payload = {
        id: user.id,
        phone: document.getElementById("phone").value.trim() || null,
        address: document.getElementById("address").value.trim() || null,
        notes: document.getElementById("notes").value.trim() || null,
      };
      if (isCompany) {
        payload.company_name = document.getElementById("companyName").value.trim() || null;
        payload.website = document.getElementById("website").value.trim() || null;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = "保存中…";

      const { error } = await supabaseClient
        .from("requester_profiles")
        .upsert(payload, { onConflict: "id" });

      submitBtn.disabled = false;
      submitBtn.textContent = "保存する";

      if (error) {
        errorBanner.textContent = `保存に失敗しました：${error.message}`;
        errorBanner.classList.add("is-visible");
        return;
      }

      showToast("プロフィールを保存しました");
      setTimeout(() => { window.location.href = "mypage.html"; }, 700);
    });
  }

  init();
</script>
</body>
</html>
