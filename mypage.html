<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<style>
  @keyframes kenshulink-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(23, 176, 138, .55); }
    50% { box-shadow: 0 0 0 8px rgba(23, 176, 138, 0); }
  }
  .btn--pulse { animation: kenshulink-pulse 1.6s ease-out infinite; }
</style>
<body data-active-nav="mypage.html">

<div id="site-header"></div>

<main class="mypage" id="mypageMain">
  <!-- JSで動的に描画 -->
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  const FORMAT_LABEL = { online: "オンライン", offline: "対面", both: "オンライン・対面" };
  let currentTab = "all";

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`;
  }

  async function markResponsesSeenByRequester(responseIds) {
    if (!responseIds.length) return;
    const { error } = await supabaseClient
      .from("instructor_responses")
      .update({ requester_seen_at: new Date().toISOString() })
      .in("response_id", responseIds)
      .is("requester_seen_at", null);
    if (error) console.error("markResponsesSeenByRequester error:", error);
  }

  async function main() {
    if (!authReady) {
      await new Promise(resolve => document.addEventListener("kenshulink:authchange", resolve, { once: true }));
    }
    const user = getCurrentUser();
    const root = document.getElementById("mypageMain");

    if (!user) {
      root.innerHTML = `
        <div class="empty-state" style="padding-top:80px;">
          <span class="hanko hanko--logo" style="margin:0 auto 16px;">研</span>
          <p class="empty-state__title">マイページを見るにはログインが必要です</p>
          <a href="login.html" class="btn btn--primary" style="margin-top:16px;">ログイン</a>
        </div>
      `;
      return;
    }

    if (user.role === "INSTRUCTOR") {
      document.body.dataset.roleTheme = "instructor";
      await renderInstructorView(root, user);
    } else {
      document.body.dataset.roleTheme = "business";
      await renderRequesterView(root, user);
    }
  }

  /* --- 公募依頼の「応募終了（未確認）」件数バッジ --- */
  async function renderOpenRequestsBadge(user) {
    const linkEl = document.getElementById("openRequestsLink");
    if (!linkEl) return;

    const { data, error } = await supabaseClient
      .from("training_requests")
      .select("request_id, instructor_responses!inner(instructor_id, is_selected, result_seen_at)")
      .is("target_instructor_id", null)
      .eq("status", "accepted")
      .eq("instructor_responses.instructor_id", user.id)
      .eq("instructor_responses.is_selected", false)
      .is("instructor_responses.result_seen_at", null);

    if (error || !data) return;

    const unseenCount = data.length;

    if (unseenCount > 0) {
      linkEl.innerHTML = `公募中の依頼を見る → <span class="status-badge status-badge--rejected" style="margin-left:6px;">${unseenCount}</span>`;
    }
  }

  /* --- 講師プロフィールの登録状況カード --- */
  async function renderProfileStatusCard(user) {
    const { data: profile } = await supabaseClient
      .from("instructor_profiles")
      .select("id, is_public, prefectures, self_pr, contact_email, contact_phone")
      .eq("id", user.id)
      .maybeSingle();

    const el = document.getElementById("profileStatusCard");
    if (!el) return;

    if (!profile) {
      el.innerHTML = `
        <div class="request-card">
          <p class="request-card__desc">プロフィールを作成すると「講師を探す」の検索結果に表示され、依頼を受けられるようになります。</p>
          <a href="instructor-profile-edit.html" class="btn btn--primary btn--sm">プロフィールを作成する</a>
        </div>
      `;
      return;
    }

    const missingContact = !profile.contact_email || !profile.contact_phone;

    el.innerHTML = `
      <div class="request-card">
        <div class="request-card__top">
          <div>
            <div class="request-card__title">プロフィール登録済み</div>
            <p class="request-card__meta">${(profile.prefectures || []).length ? profile.prefectures.join("、") : "エリア未設定"}</p>
          </div>
          <span class="status-badge ${profile.is_public ? "status-badge--accepted" : "status-badge--pending"}">
            ${profile.is_public ? "公開中" : "非公開"}
          </span>
        </div>
        <p class="request-card__desc">${profile.self_pr || "自己紹介が未入力です。"}</p>
        ${missingContact ? `
          <div class="request-card__response">
            <strong>連絡先情報が未入力です</strong>
            ${!profile.contact_email ? "メール　" : ""}${!profile.contact_phone ? "電話番号" : ""}が未登録のため、依頼が承諾された後も相手にお知らせできません。プロフィール編集から登録してください。
          </div>
        ` : ""}
        <div class="request-card__actions">
          <a href="instructor-profile-edit.html" class="btn btn--ghost btn--sm">プロフィールを編集する</a>
          <a href="instructor-detail.html?id=${profile.id}" class="btn btn--ghost btn--sm">公開ページを見る</a>
        </div>
      </div>
    `;
  }

  /* ==========================================================================
     講師側マイページ — 受け取った依頼（training_requests + 自分の instructor_responses）
     ========================================================================== */
  async function renderInstructorView(root, user) {
    root.innerHTML = `
      <div class="mypage__head">
        <h1 class="mypage__title">マイページ（講師）</h1>
        <p class="mypage__role">${user.name} としてログイン中</p>
      </div>
      <div id="profileStatusCard" style="margin-bottom:28px;">
        <p style="color:var(--color-ink-soft); font-size:13px;">プロフィール状況を読み込み中…</p>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 class="section__title" style="font-size:18px; margin:0;">受け取った依頼</h2>
        <a href="open-requests.html" class="btn btn--ghost btn--sm" id="openRequestsLink">公募中の依頼を見る →</a>
      </div>
      <div class="status-tabs" id="statusTabs"></div>
      <div id="requestList"><p style="color:var(--color-ink-soft); font-size:13px;">読み込み中…</p></div>
    `;

    renderProfileStatusCard(user);
    renderOpenRequestsBadge(user);

    const { data, error } = await supabaseClient
      .from("training_requests")
      .select("*, instructor_responses(*), training_reviews(*)")
      .eq("target_instructor_id", user.id)
      .order("created_at", { ascending: false });

    const listEl = document.getElementById("requestList");
    if (error) {
      listEl.innerHTML = `<p style="color:var(--color-danger); font-size:13px;">読み込みエラー：${error.message}</p>`;
      return;
    }

    const all = (data || []).map(r => ({ ...r, myResponse: (r.instructor_responses || []).find(x => x.instructor_id === user.id) || null }));

    function displayStatus(r) {
      if (r.status === "cancelled") return { key: "cancelled", label: "依頼者によりキャンセル" };
      if (r.status === "completed") return { key: "completed", label: "完了" };
      if (r.status === "accepted") return { key: "accepted", label: "承諾済み" };
      if (r.myResponse) {
        if (r.myResponse.action === "reject" || r.myResponse.action === "withdrawn") return { key: "rejected", label: "却下済み" };
        return { key: "quoted", label: "返信済み（依頼者の確定待ち）" };
      }
      return { key: "pending", label: "対応待ち" };
    }

    const tabs = [
      ["all", "すべて"], ["pending", "対応待ち"], ["quoted", "返信済み"],
      ["accepted", "承諾済み"], ["completed", "完了"], ["rejected", "却下"], ["cancelled", "キャンセル"],
    ];
    document.getElementById("statusTabs").innerHTML = tabs.map(([key, label]) => {
      const count = key === "all" ? all.length : all.filter(r => displayStatus(r).key === key).length;
      return `<button type="button" class="status-tab ${key === currentTab ? "is-active" : ""}" data-tab="${key}">${label}<span class="status-tab__count">(${count})</span></button>`;
    }).join("");

    document.querySelectorAll("#statusTabs .status-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.dataset.tab;
        // タブの見た目（is-active）はここで即座に切り替える。
        // 以前はここが無く、下のリスト再描画を待つまで色が動かない
        // ように見えるバグがあった（「反応が遅い」というレビュー原因）。
        document.querySelectorAll("#statusTabs .status-tab").forEach(b => b.classList.toggle("is-active", b === btn));
        renderInstructorList(all, user, displayStatus);
      });
    });

    renderInstructorList(all, user, displayStatus);
  }

  async function renderInstructorList(all, user, displayStatus) {
    const listEl = document.getElementById("requestList");
    const filtered = currentTab === "all" ? all : all.filter(r => displayStatus(r).key === currentTab);

    if (filtered.length === 0) {
      listEl.innerHTML = `<div class="empty-state"><p class="empty-state__title">該当する依頼はありません</p></div>`;
      return;
    }

    // 承諾済みの依頼者情報（unlock 済みなら users・requester_profiles を読める）をまとめて取得
    const acceptedRequesterIds = filtered.filter(r => r.status === "accepted" || r.status === "completed").map(r => r.requester_id);
    let requesterMap = {};
    if (acceptedRequesterIds.length) {
      const { data: requesters } = await supabaseClient.from("users").select("id, name, email").in("id", acceptedRequesterIds);
      requesters?.forEach(u => { requesterMap[u.id] = u; });
      const { data: requesterProfiles } = await supabaseClient.from("requester_profiles").select("*").in("id", acceptedRequesterIds);
      requesterProfiles?.forEach(p => { requesterMap[p.id] = { ...requesterMap[p.id], ...p }; });
    }

    listEl.innerHTML = filtered.map(r => {
      const st = displayStatus(r);
      const requester = requesterMap[r.requester_id];
      const review = (r.training_reviews || [])[0] || null;
      return `
      <div class="request-card" data-id="${r.request_id}" data-review-id="${review ? review.review_id : ""}">
        <div class="request-card__top">
          <div>
            <div class="request-card__title">${r.title}</div>
            <div class="request-card__meta">
              <span>${r.requester_type === "company" ? "企業" : "生徒"}からの依頼</span>
              <span>${fmtDate(r.created_at)}</span>
            </div>
          </div>
          <span class="status-badge status-badge--${st.key === "quoted" ? "quoted" : st.key === "rejected" ? "rejected" : st.key}">${st.label}</span>
        </div>

        <p class="request-card__desc">${r.description}</p>
        <div class="request-card__tags">
          <span class="instructor-card__tag">${FORMAT_LABEL[r.preferred_format] || r.preferred_format}</span>
          ${r.budget ? `<span class="instructor-card__tag">予算 ¥${Number(r.budget).toLocaleString()}</span>` : ""}
          ${r.participant_count ? `<span class="instructor-card__tag">対象${r.participant_count}名</span>` : ""}
          ${r.location ? `<span class="instructor-card__tag">${r.location}</span>` : ""}
          ${r.preferred_schedule ? `<span class="instructor-card__tag">${r.preferred_schedule}</span>` : ""}
        </div>

        ${r.myResponse ? `
          <div class="request-card__response">
            <strong>あなたの対応：${r.myResponse.action === "accept" ? "承諾" : r.myResponse.action === "quote" ? `見積り ¥${Number(r.myResponse.quote_price || 0).toLocaleString()}` : "却下"}</strong>
            ${r.myResponse.message || "（メッセージなし）"}
          </div>
        ` : ""}

        ${(st.key === "accepted" || st.key === "completed") ? `
          <div class="contact-box">
            <strong>連絡先：</strong>
            ${requester ? `
              <div>${requester.company_name ? "会社名：" + requester.company_name : "担当者：" + requester.name}</div>
              <div>メール：${requester.email}</div>
              <div>電話番号：${requester.phone || "未登録"}</div>
            ` : "読み込み中…"}
          </div>
        ` : ""}

        ${(!r.myResponse && r.status === "pending") ? `
          <div class="request-card__actions">
            <button type="button" class="btn btn--primary btn--sm" data-action="accept">承諾する</button>
            <button type="button" class="btn btn--ghost btn--sm" data-action="quote-toggle">見積りを送る</button>
            <button type="button" class="btn btn--danger btn--sm" data-action="reject">却下する</button>
          </div>
          <div class="inline-quote-form" data-quote-form>
            <div class="form-field">
              <label>見積り金額（時間あたり）</label>
              <input type="number" min="0" step="1000" placeholder="例：14000" data-quote-price>
            </div>
            <div class="form-field">
              <label>メッセージ</label>
              <textarea rows="2" placeholder="見積りの補足があればご記入ください" data-quote-message></textarea>
            </div>
            <button type="button" class="btn btn--primary btn--sm" data-action="quote-submit">この内容で見積りを送る</button>
          </div>
        ` : ""}

        ${review ? `
          <div class="review-item" style="margin-top:14px;">
            <div class="review-item__top">
              <span class="review-item__name">依頼者からのレビュー</span>
              <span class="review-item__rating">★ ${review.rating}</span>
            </div>
            <p class="review-item__comment">${review.comment || "（コメントなし）"}</p>
          </div>
          ${review.instructor_reply ? `
            <div class="request-card__response">
              <strong>あなたの返信</strong>
              ${review.instructor_reply}
            </div>
          ` : `
            <div class="request-card__actions">
              <button type="button" class="btn btn--ghost btn--sm" data-action="reply-toggle">レビューに返信する</button>
            </div>
            <div class="inline-quote-form" data-reply-form>
              <div class="form-field">
                <label>返信メッセージ</label>
                <textarea rows="2" placeholder="ご感想へのお礼や補足をご記入ください" data-reply-text></textarea>
              </div>
              <button type="button" class="btn btn--primary btn--sm" data-action="reply-submit">返信を送信する</button>
            </div>
          `}
        ` : ""}
      </div>
    `;
    }).join("");

    listEl.querySelectorAll(".request-card").forEach(card => {
      const requestId = card.dataset.id;

      card.querySelector('[data-action="accept"]')?.addEventListener("click", async () => {
        const { error } = await supabaseClient.from("instructor_responses").insert({ request_id: requestId, instructor_id: user.id, action: "accept" });
        if (error) { showToast(`エラー：${error.message}`); return; }
        showToast("依頼を承諾しました。依頼者の確定操作をお待ちください。");
        main();
      });

      card.querySelector('[data-action="reject"]')?.addEventListener("click", async () => {
        const { error } = await supabaseClient.from("instructor_responses").insert({ request_id: requestId, instructor_id: user.id, action: "reject" });
        if (error) { showToast(`エラー：${error.message}`); return; }
        showToast("依頼を却下しました。");
        main();
      });

      card.querySelector('[data-action="quote-toggle"]')?.addEventListener("click", () => {
        card.querySelector("[data-quote-form]").classList.toggle("is-open");
      });

      card.querySelector('[data-action="quote-submit"]')?.addEventListener("click", async () => {
        const price = Number(card.querySelector("[data-quote-price]").value) || null;
        const message = card.querySelector("[data-quote-message]").value.trim() || null;
        if (!price) { showToast("見積り金額を入力してください"); return; }
        const { error } = await supabaseClient.from("instructor_responses").insert({ request_id: requestId, instructor_id: user.id, action: "quote", quote_price: price, message });
        if (error) { showToast(`エラー：${error.message}`); return; }
        showToast("見積りを送信しました。");
        main();
      });

      card.querySelector('[data-action="reply-toggle"]')?.addEventListener("click", () => {
        card.querySelector("[data-reply-form]").classList.toggle("is-open");
      });

      card.querySelector('[data-action="reply-submit"]')?.addEventListener("click", async (ev) => {
        const replyText = card.querySelector("[data-reply-text]").value.trim();
        if (!replyText) { showToast("返信内容を入力してください"); return; }

        const reviewId = card.dataset.reviewId;
        const btn = ev.currentTarget;
        if (btn.disabled) return;
        btn.disabled = true;
        btn.textContent = "送信中…";

        const { error } = await supabaseClient
          .from("training_reviews")
          .update({ instructor_reply: replyText, replied_at: new Date().toISOString() })
          .eq("review_id", reviewId);

        if (error) {
          showToast(`エラー：${error.message}`);
          btn.disabled = false;
          btn.textContent = "返信を送信する";
          return;
        }
        showToast("返信を投稿しました。");
        main();
      });
    });
  }

  /* ==========================================================================
     依頼者側（企業／個人）マイページ
     ========================================================================== */
  /* --- 依頼者（企業／個人）のプロフィール登録状況カード --- */
  async function renderRequesterProfileCard(user) {
    const { data: profile } = await supabaseClient
      .from("requester_profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    const el = document.getElementById("requesterProfileCard");
    if (!el) return;

    if (!profile) {
      el.innerHTML = `
        <div class="request-card">
          <p class="request-card__desc">電話番号・会社情報を登録しておくと、依頼が承諾された際に講師へスムーズに共有されます。</p>
          <a href="requester-profile-edit.html" class="btn btn--primary btn--sm">プロフィールを作成する</a>
        </div>
      `;
      return;
    }

    el.innerHTML = `
      <div class="request-card">
        <div class="request-card__top">
          <div>
            <div class="request-card__title">${profile.company_name || user.name}</div>
            ${profile.website ? `<p class="request-card__meta"><a href="${profile.website}" target="_blank" rel="noopener">${profile.website}</a></p>` : ""}
          </div>
        </div>
        <p class="request-card__desc">
          電話番号：${profile.phone || "未登録"}<br>
          住所：${profile.address || "未登録"}
        </p>
        <div class="request-card__actions">
          <a href="requester-profile-edit.html" class="btn btn--ghost btn--sm">プロフィールを編集する</a>
        </div>
      </div>
    `;
  }

  async function renderRequesterView(root, user) {
    root.innerHTML = `
      <div class="mypage__head">
        <h1 class="mypage__title">マイページ（${user.role === "COMPANY" ? "企業" : "生徒"}）</h1>
        <p class="mypage__role">${user.name} としてログイン中</p>
      </div>
      <div id="requesterProfileCard" style="margin-bottom:28px;">
        <p style="color:var(--color-ink-soft); font-size:13px;">プロフィール状況を読み込み中…</p>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h2 class="section__title" style="font-size:18px; margin:0;">依頼一覧<span id="newResponseBadge"></span></h2>
        <a href="post-request.html" class="btn btn--primary btn--sm">研修を依頼する（公募）</a>
      </div>
      <div class="status-tabs" id="statusTabs"></div>
      <div id="requestList"><p style="color:var(--color-ink-soft); font-size:13px;">読み込み中…</p></div>
    `;

    renderRequesterProfileCard(user);

    const { data, error } = await supabaseClient
      .from("training_requests")
      .select("*, instructor_responses(*), training_reviews(*)")
      .eq("requester_id", user.id)
      .order("created_at", { ascending: false });

    const listEl = document.getElementById("requestList");
    if (error) {
      listEl.innerHTML = `<p style="color:var(--color-danger); font-size:13px;">読み込みエラー：${error.message}</p>`;
      return;
    }

    const all = data || [];

    // 「新着の応募・返信（未確認）」件数バッジ表示。
    // requester_seen_at が null のものを「未確認」とみなし、バッジに件数を出したうえで
    // このページを開いた時点で既読にする（次回訪問時にはバッジが消える）。
    const unseenResponseIds = all.flatMap(r => (r.instructor_responses || [])
      .filter(x => x.requester_seen_at === null)
      .map(x => x.response_id));
    const badgeEl = document.getElementById("newResponseBadge");
    if (badgeEl && unseenResponseIds.length > 0) {
      badgeEl.innerHTML = ` <span class="status-badge status-badge--rejected" style="margin-left:6px;">${unseenResponseIds.length}</span>`;
    }
    markResponsesSeenByRequester(unseenResponseIds);

    // 通常依頼（1対1）は target_instructor_id で確定。公募依頼（target_instructor_id = NULL）は
    // 「選ばれた講師（is_selected = true）」、まだ確定前なら「最初の応募者」を暫定的に使う。
    function resolveInstructorId(r) {
      if (r.target_instructor_id) return r.target_instructor_id;
      const responses = r.instructor_responses || [];
      const selected = responses.find(x => x.is_selected);
      if (selected) return selected.instructor_id;
      return responses[0]?.instructor_id || null;
    }

    const allResponseInstructorIds = all.flatMap(r => (r.instructor_responses || []).map(x => x.instructor_id));
    const targetIds = [...new Set([
      ...all.map(r => resolveInstructorId(r)).filter(Boolean),
      ...allResponseInstructorIds,
    ])];
    let instructorMap = {};
    if (targetIds.length) {
      // ⚠️ FIX: instructor_public_directory には contact_email / contact_phone 列が存在しないため、
      // 以前は select にこの2列を含めていて query が失敗し、name まで取得できなくなっていた。
      // ここでは name（と id）だけを取得する。
      const { data: instr, error: instrError } = await supabaseClient
        .from("instructor_public_directory")
        .select("id, name")
        .in("id", targetIds);
      if (instrError) {
        console.error("instructor_public_directory query error:", instrError);
      }
      instr?.forEach(i => { instructorMap[i.id] = i; });
    }
    const acceptedIds = all.filter(r => r.status === "accepted" || r.status === "completed").map(r => resolveInstructorId(r)).filter(Boolean);
    if (acceptedIds.length) {
      const { data: unlocked } = await supabaseClient.from("instructor_profiles").select("id, contact_email, contact_phone").in("id", acceptedIds);
      unlocked?.forEach(i => { instructorMap[i.id] = { ...instructorMap[i.id], ...i }; });
    }

    function responseOf(r) { return (r.instructor_responses || [])[0] || null; }
    function anyActionableResponse(r) {
      return (r.instructor_responses || []).some(x => x.action === "accept" || x.action === "quote");
    }
    function displayStatus(r) {
      if (r.status === "cancelled") return { key: "cancelled", label: "キャンセル済み" };
      if (r.status === "completed") return { key: "completed", label: "完了" };
      if (r.status === "accepted") return { key: "accepted", label: "承諾済み" };

      const isBroadcast = !r.target_instructor_id;
      if (!isBroadcast) {
        // 通常依頼（1対1）：1人の講師の返信のみで判定
        const resp = responseOf(r);
        if (resp) {
          if (resp.action === "reject" || resp.action === "withdrawn") return { key: "rejected", label: "却下" };
          return { key: "quoted", label: "見積り提示中" };
        }
        return { key: "pending", label: "対応待ち" };
      }
      // 公募依頼：誰か1人でも承諾／見積りがあれば「見積り提示中」。全員却下でも他の講師が応募できるため pending のまま。
      if (anyActionableResponse(r)) return { key: "quoted", label: "見積り提示中" };
      return { key: "pending", label: "対応待ち" };
    }

    const tabs = [
      ["all", "すべて"], ["pending", "対応待ち"], ["quoted", "見積り提示中"],
      ["accepted", "承諾済み"], ["completed", "完了"], ["rejected", "却下"], ["cancelled", "キャンセル"],
    ];
    document.getElementById("statusTabs").innerHTML = tabs.map(([key, label]) => {
      const count = key === "all" ? all.length : all.filter(r => displayStatus(r).key === key).length;
      return `<button type="button" class="status-tab ${key === currentTab ? "is-active" : ""}" data-tab="${key}">${label}<span class="status-tab__count">(${count})</span></button>`;
    }).join("");

    document.querySelectorAll("#statusTabs .status-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll("#statusTabs .status-tab").forEach(b => b.classList.toggle("is-active", b === btn));
        renderRequesterList(all, user, displayStatus, responseOf, instructorMap);
      });
    });

    renderRequesterList(all, user, displayStatus, responseOf, instructorMap);
  }

  function renderRequesterList(all, user, displayStatus, responseOf, instructorMap) {
    const listEl = document.getElementById("requestList");
    const filtered = currentTab === "all" ? all : all.filter(r => displayStatus(r).key === currentTab);

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <p class="empty-state__title">該当する依頼はありません</p>
          <p class="empty-state__desc">「講師を探す」から気になる講師に依頼を送ってみましょう。</p>
        </div>`;
      return;
    }

    listEl.innerHTML = filtered.map(r => {
      const st = displayStatus(r);
      const isBroadcast = !r.target_instructor_id;
      const resp = responseOf(r);
      const selectedResp = (r.instructor_responses || []).find(x => x.is_selected);
      const instr = instructorMap[r.target_instructor_id || (selectedResp || resp)?.instructor_id || null] || {};
      const review = (r.training_reviews || [])[0] || null;

      // 公募依頼：承諾／見積りを送ってきた講師の一覧（却下・取り下げは除く）
      const applicants = isBroadcast
        ? (r.instructor_responses || []).filter(x => x.action === "accept" || x.action === "quote")
        : [];

      return `
      <div class="request-card" data-id="${r.request_id}" data-response-id="${resp ? resp.response_id : ""}" data-instructor-id="${resp ? resp.instructor_id : (r.target_instructor_id || "")}">
        <div class="request-card__top">
          <div>
            <div class="request-card__title">${r.title}</div>
            <div class="request-card__meta">
              <span>${isBroadcast ? (st.key === "accepted" || st.key === "completed" ? `決定：${instr.name || "講師"} 先生` : "公募依頼") : `依頼先：${instr.name || "講師"} 先生`}</span>
              <span>${fmtDate(r.created_at)}</span>
            </div>
          </div>
          <span class="status-badge status-badge--${st.key === "quoted" ? "quoted" : st.key === "rejected" ? "rejected" : st.key}">${st.label}</span>
        </div>

        <p class="request-card__desc">${r.description}</p>
        <div class="request-card__tags">
          <span class="instructor-card__tag">${FORMAT_LABEL[r.preferred_format] || r.preferred_format}</span>
          ${r.budget ? `<span class="instructor-card__tag">予算 ¥${Number(r.budget).toLocaleString()}</span>` : ""}
          ${r.participant_count ? `<span class="instructor-card__tag">対象${r.participant_count}名</span>` : ""}
        </div>

        ${isBroadcast ? `
          ${applicants.length === 0 ? `
            <p class="request-card__desc" style="color:var(--color-ink-soft);">まだ講師からの応募はありません。</p>
            <div class="request-card__actions">
              <a href="request-detail.html?id=${r.request_id}" class="btn btn--primary btn--sm btn--pulse" style="margin-bottom:14px;">おすすめの講師を見る</a>
            </div>
          ` : st.key === "pending" || st.key === "quoted" ? `
            <div class="applicant-list" style="margin-top:12px; display:flex; flex-direction:column; gap:10px;">
              ${applicants.map(a => {
                const aInstr = instructorMap[a.instructor_id] || {};
                return `
                <div class="request-card__response" data-applicant="${a.response_id}" data-applicant-instructor="${a.instructor_id}">
                  <strong>${aInstr.name || "講師"} 先生：${a.action === "accept" ? "承諾" : `見積り ¥${Number(a.quote_price || 0).toLocaleString()}`}</strong>
                  ${a.requester_seen_at === null ? `<span class="status-badge status-badge--rejected" style="margin-left:6px; font-size:10px;">NEW</span>` : ""}
                  <p style="margin:4px 0 8px;">${a.message || "（メッセージなし）"}</p>
                  <button type="button" class="btn btn--primary btn--sm" data-action="finalize-applicant">この講師に決定する</button>
                </div>
              `;
              }).join("")}
            </div>
          ` : ""}
        ` : `
          ${resp ? `
            <div class="request-card__response">
              <strong>講師からの返信：${resp.action === "accept" ? "承諾" : resp.action === "quote" ? `見積り ¥${Number(resp.quote_price || 0).toLocaleString()}` : "却下"}</strong>
              ${resp.requester_seen_at === null ? `<span class="status-badge status-badge--rejected" style="margin-left:6px; font-size:10px;">NEW</span>` : ""}
              ${resp.message || "（メッセージなし）"}
            </div>
          ` : `<p class="request-card__desc" style="color:var(--color-ink-soft);">講師の返信をお待ちください。</p>`}

          ${(st.key === "quoted" && resp) ? `
            <div class="request-card__actions">
              <button type="button" class="btn btn--primary btn--sm" data-action="finalize">この内容で依頼を確定する</button>
              <button type="button" class="btn btn--danger btn--sm" data-action="cancel">依頼をキャンセルする</button>
            </div>
          ` : ""}
        `}

        ${st.key === "pending" ? `
          <div class="request-card__actions">
            <button type="button" class="btn btn--danger btn--sm" data-action="cancel">依頼をキャンセルする</button>
          </div>
        ` : ""}

        ${(st.key === "accepted") ? `
          <div class="contact-box">
            <strong>連絡先：</strong>
            <div>名前：${instr.name || "講師"}</div>
            <div>メール：${instr.contact_email || "未登録"}</div>
            <div>電話番号：${instr.contact_phone || "未登録"}</div>
          </div>
          <div class="request-card__actions">
            <button type="button" class="btn btn--ghost btn--sm" data-action="complete">研修完了として記録する</button>
          </div>
        ` : ""}

        ${st.key === "completed" ? (
          review
            ? `<div class="request-card__response"><strong>投稿済みレビュー：★ ${review.rating}</strong>${review.comment || ""}</div>
               ${review.instructor_reply ? `<div class="request-card__response"><strong>講師からの返信</strong>${review.instructor_reply}</div>` : ""}`
            : `
              <div class="request-card__actions">
                <button type="button" class="btn btn--primary btn--sm" data-action="review-toggle">レビューを投稿する</button>
              </div>
              <div class="review-form-inline" data-review-form>
                <div class="star-picker" data-star-picker>
                  ${[1,2,3,4,5].map(n => `<button type="button" data-star="${n}">★</button>`).join("")}
                </div>
                <div class="form-field">
                  <textarea rows="2" placeholder="研修の感想をご記入ください" data-review-comment></textarea>
                </div>
                <button type="button" class="btn btn--primary btn--sm" data-action="review-submit">レビューを送信する</button>
              </div>
            `
        ) : ""}
      </div>
    `;
    }).join("");

    listEl.querySelectorAll(".request-card").forEach(card => {
      const requestId = card.dataset.id;
      const responseId = card.dataset.responseId;
      const instructorId = card.dataset.instructorId;

      card.querySelector('[data-action="finalize"]')?.addEventListener("click", async () => {
        if (!responseId) return;
        const { error: e1 } = await supabaseClient.from("instructor_responses").update({ is_selected: true }).eq("response_id", responseId);
        if (e1) { showToast(`エラー：${e1.message}`); return; }
        const { error: e2 } = await supabaseClient.from("training_requests").update({ status: "accepted" }).eq("request_id", requestId);
        if (e2) { showToast(`エラー：${e2.message}`); return; }
        const { error: e3 } = await supabaseClient.from("contact_unlocks").insert({ request_id: requestId, response_id: responseId, requester_id: user.id, instructor_id: instructorId });
        if (e3) { showToast(`エラー：${e3.message}`); return; }
        showToast("依頼を確定しました。連絡先が開示されます。");
        main();
      });

      card.querySelectorAll('[data-action="finalize-applicant"]').forEach(btn => {
        btn.addEventListener("click", async () => {
          const applicantBox = btn.closest("[data-applicant]");
          const applicantResponseId = applicantBox?.dataset.applicant;
          const applicantInstructorId = applicantBox?.dataset.applicantInstructor;
          if (!applicantResponseId || !applicantInstructorId) return;

          if (!confirm("この講師に決定しますか？他の応募者には決定されなかった旨が表示されます。")) return;

          const { error: e1 } = await supabaseClient.from("instructor_responses").update({ is_selected: true }).eq("response_id", applicantResponseId);
          if (e1) { showToast(`エラー：${e1.message}`); return; }
          const { error: e2 } = await supabaseClient.from("training_requests").update({ status: "accepted" }).eq("request_id", requestId);
          if (e2) { showToast(`エラー：${e2.message}`); return; }
          const { error: e3 } = await supabaseClient.from("contact_unlocks").insert({ request_id: requestId, response_id: applicantResponseId, requester_id: user.id, instructor_id: applicantInstructorId });
          if (e3) { showToast(`エラー：${e3.message}`); return; }
          showToast("依頼を確定しました。連絡先が開示されます。");
          main();
        });
      });

      card.querySelector('[data-action="cancel"]')?.addEventListener("click", async () => {
        const reason = prompt("キャンセル理由を入力してください（任意）") || null;
        const { error } = await supabaseClient.from("training_requests").update({ status: "cancelled", cancel_reason: reason, cancelled_at: new Date().toISOString() }).eq("request_id", requestId);
        if (error) { showToast(`エラー：${error.message}`); return; }
        showToast("依頼をキャンセルしました。");
        main();
      });

      card.querySelector('[data-action="complete"]')?.addEventListener("click", async () => {
        const { error } = await supabaseClient.from("training_requests").update({ status: "completed" }).eq("request_id", requestId);
        if (error) { showToast(`エラー：${error.message}`); return; }
        showToast("研修を完了として記録しました。レビューを投稿できます。");
        main();
      });

      card.querySelector('[data-action="review-toggle"]')?.addEventListener("click", () => {
        card.querySelector("[data-review-form]").classList.toggle("is-open");
      });

      let selectedStars = 0;
      const starPicker = card.querySelector("[data-star-picker]");
      starPicker?.querySelectorAll("button").forEach(starBtn => {
        starBtn.addEventListener("click", () => {
          selectedStars = Number(starBtn.dataset.star);
          starPicker.querySelectorAll("button").forEach(b => b.classList.toggle("is-filled", Number(b.dataset.star) <= selectedStars));
        });
      });

      card.querySelector('[data-action="review-submit"]')?.addEventListener("click", async (ev) => {
        const comment = card.querySelector("[data-review-comment]").value.trim();
        if (!selectedStars) { showToast("評価（星）を選択してください"); return; }

        const btn = ev.currentTarget;
        if (btn.disabled) return; // 二重クリック防止
        btn.disabled = true;
        btn.textContent = "送信中…";

        const { error } = await supabaseClient.from("training_reviews").upsert({
          request_id: requestId, reviewer_id: user.id, instructor_id: instructorId, rating: selectedStars, comment: comment || null,
        }, { onConflict: "request_id" });

        if (error) {
          showToast(`エラー：${error.message}`);
          btn.disabled = false;
          btn.textContent = "レビューを送信する";
          return;
        }
        showToast("レビューを投稿しました。ありがとうございます！");
        main();
      });
    });
  }

  document.addEventListener("kenshulink:authchange", main);
  main();
</script>
</body>
</html>
