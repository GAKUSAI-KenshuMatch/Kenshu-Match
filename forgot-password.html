<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワードをお忘れの方 | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="login.html">

<div id="site-header"></div>

<main class="auth-page">
  <div class="auth-card">
    <p class="auth-card__eyebrow">RESET PASSWORD</p>
    <h1 class="auth-card__title">パスワードをお忘れの方</h1>
    <p class="auth-card__desc">登録済みのメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>

    <div class="notice-banner" id="resetError">エラーが発生しました。</div>
    <div class="notice-banner" id="resetSuccess" style="background:#e8f7ef; color:#1e7a4c;">
      メールを送信しました。受信トレイをご確認ください。
    </div>

    <form id="resetForm" novalidate>
      <div class="form-field">
        <label for="resetEmail">メールアドレス</label>
        <input type="email" id="resetEmail" name="email" placeholder="you@example.com" required>
        <p class="form-field__error">メールアドレスを正しく入力してください。</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn--block">再設定用リンクを送る</button>
      </div>
    </form>

    <p class="auth-switch">
      <a href="login.html">ログイン画面に戻る</a>
    </p>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const emailField = document.getElementById("resetEmail").closest(".form-field");
    const email = document.getElementById("resetEmail").value;

    const errorBanner = document.getElementById("resetError");
    const successBanner = document.getElementById("resetSuccess");
    errorBanner.classList.remove("is-visible");
    successBanner.classList.remove("is-visible");

    emailField.classList.toggle("has-error", !email.includes("@"));
    if (!email.includes("@")) return;

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "送信中…";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: `${window.location.origin}${window.location.pathname.replace(/forgot-password\.html$/, "")}reset-password.html`,
    });

    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;

    if (error) {
      errorBanner.textContent = `送信に失敗しました：${error.message}`;
      errorBanner.classList.add("is-visible");
      return;
    }

    successBanner.classList.add("is-visible");
    document.getElementById("resetForm").reset();
  });
</script>
</body>
</html>
