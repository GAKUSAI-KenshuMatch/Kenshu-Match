<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>講師プロフィール | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="instructors.html" data-role-theme="business">

<div id="site-header"></div>

<main class="detail-page" id="detailMain">
  <!-- JSで動的に描画 -->
</main>

<div id="site-footer"></div>

<!-- ===================== モーダル：依頼フォーム ===================== -->
<div class="modal-overlay" id="requestModal">
  <div class="modal-box">
    <button class="modal-close" id="closeRequestModal" aria-label="閉じる">×</button>
    <p class="modal-title">研修を依頼する</p>
    <p class="modal-desc" id="requestModalDesc">依頼内容を入力してください。講師が確認後、承諾・見積り・却下のいずれかで返信します。</p>

    <div class="notice-banner" id="requestFormError">入力内容をご確認ください。</div>

    <form id="requestForm" novalidate>
      <div class="form-field">
        <label for="reqTitle">依頼タイトル</label>
        <input type="text" id="reqTitle" placeholder="例：新人エンジニア向けPython基礎研修" required>
        <p class="form-field__error">タイトルを入力してください。</p>
      </div>

      <div class="form-field">
        <label for="reqExpertise">希望分野</label>
        <select id="reqExpertise" required></select>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="reqFormat">希望形態</label>
          <select id="reqFormat" required></select>
        </div>
        <div class="form-field">
          <label for="reqBudget">想定予算（時間あたり）</label>
          <input type="number" id="reqBudget" placeholder="例：15000" min="0" step="1000">
        </div>
      </div>

      <div class="form-field">
        <label for="reqParticipants">対象人数</label>
        <input type="number" id="reqParticipants" placeholder="例：10" min="1" step="1">
      </div>

      <div class="form-field" id="reqLocationField">
        <label for="reqLocation">実施場所（対面の場合は必須）</label>
        <input type="text" id="reqLocation" placeholder="例：東京都内オフィス">
      </div>

      <div class="form-field">
        <label for="reqSchedule">希望日程</label>
        <input type="text" id="reqSchedule" placeholder="例：8月中旬 平日午後">
      </div>

      <div class="form-field">
        <label for="reqDescription">依頼内容の詳細</label>
        <textarea id="reqDescription" rows="4" placeholder="研修の目的、対象人数、レベル感などをご記入ください" required></textarea>
        <p class="form-field__error">依頼内容を入力してください。</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn--block">この内容で依頼を送る</button>
      </div>
    </form>
  </div>
</div>

<!-- ===================== モーダル：ログインゲート ===================== -->
<div class="modal-overlay" id="loginGateModal">
  <div class="modal-box" style="max-width:420px; text-align:center;">
    <button class="modal-close" id="closeLoginGate" aria-label="閉じる">×</button>
    <span class="hanko hanko--logo login-gate__icon" style="margin:0 auto 16px;">研</span>
    <p class="modal-title" id="loginGateTitle">ログインが必要です</p>
    <p class="modal-desc" id="loginGateDesc">講師に依頼を送るには、企業または生徒アカウントでログインしてください。</p>
    <div class="form-actions" style="flex-direction:column;">
      <a href="login.html" class="btn btn--primary btn--block">ログイン</a>
      <a href="register.html" class="btn btn--ghost btn--block">新規登録</a>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/requests-store.js"></script>
<script src="assets/layout.js"></script>
<script>
  const FORMAT_LABEL = { online: "オンライン対応", offline: "対面のみ", both: "オンライン・対面 両方" };
  const WORK_STYLE_LABEL = { ONLINE: "オンラインのみ", ONSITE: "対面のみ", HYBRID: "オンライン・対面 両方" };
  const params = new URLSearchParams(location.search);
  const instructorId = params.get("id") || MOCK_INSTRUCTORS[0].id;
  const isRealId = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(instructorId);

  let instructor = null;
  let detail = {};
  let reviews = [];

  async function loadInstructorData() {
    if (isRealId) {
      const { data: profile, error } = await supabaseClient
        .from("instructor_public_directory")
        .select("*")
        .eq("id", instructorId)
        .maybeSingle();

      if (error || !profile) {
        document.getElementById("detailMain").innerHTML = `
          <div class="empty-state" style="padding-top:80px;">
            <p class="empty-state__title">この講師のプロフィールは見つかりませんでした</p>
            <p class="empty-state__desc">非公開になっているか、削除された可能性があります。</p>
            <a href="instructors.html" class="btn btn--primary" style="margin-top:16px;">講師一覧に戻る</a>
          </div>
        `;
        return false;
      }

      instructor = {
        id: profile.id,
        name: profile.name || "（名前未設定）",
        initial: (profile.name || "?").trim().slice(0, 1),
        expertiseFields: profile.expertise_fields || [],
        workFormat: null,
        workFormatLabel: WORK_STYLE_LABEL[profile.work_style] || "応相談",
        workArea: (profile.prefectures || []).length ? profile.prefectures.join("、") : "エリア未設定",
        hourlyRate: profile.desired_rate_min ?? null,
        hourlyRateLabel: profile.desired_rate_min != null ? `¥${Number(profile.desired_rate_min).toLocaleString()}` : "応相談",
        yearsExperience: profile.years_of_experience ?? "-",
        ratingAvg: profile.rating_avg != null ? Number(profile.rating_avg) : 0,
        reviewCount: 0,
        introduction: profile.self_pr || "自己紹介はまだ登録されていません。",
      };
      detail = {
        bio: profile.self_pr,
        certifications: profile.certifications,
        availableSchedule: null,
      };

      const { data: reviewRows } = await supabaseClient
        .from("training_reviews")
        .select("rating, comment, created_at")
        .eq("instructor_id", instructorId)
        .order("created_at", { ascending: false });

      reviews = (reviewRows || []).map(r => ({
        reviewerName: "利用者",
        reviewerType: "business",
        rating: r.rating,
        comment: r.comment,
        date: (r.created_at || "").slice(0, 10),
      }));
      instructor.reviewCount = reviews.length;
      return true;
    }

    // --- モックデータ（デモ用の旧データ、id が UUID でない場合） ---
    instructor = MOCK_INSTRUCTORS.find(i => i.id === instructorId) || MOCK_INSTRUCTORS[0];
    instructor.workFormatLabel = FORMAT_LABEL[instructor.workFormat] || "応相談";
    instructor.hourlyRateLabel = `¥${instructor.hourlyRate.toLocaleString()}`;
    detail = INSTRUCTOR_DETAILS[instructor.id] || {};
    reviews = MOCK_REVIEWS[instructor.id] || [];
    return true;
  }

  function renderDetail() {
    const main = document.getElementById("detailMain");
    const tags = instructor.expertiseFields.map(f => `<span class="instructor-card__tag">${f}</span>`).join("");

    const reviewsHtml = reviews.length
      ? reviews.map(r => `
          <div class="review-item">
            <div class="review-item__top">
              <span class="review-item__name">${r.reviewerName}</span>
              <span class="review-item__badge">${r.reviewerType === "business" ? "企業" : "生徒"}</span>
              <span class="review-item__rating">★ ${r.rating}</span>
            </div>
            <p class="review-item__comment">${r.comment}</p>
            <span class="review-item__date">${r.date}</span>
          </div>
        `).join("")
      : `<p class="detail-block__text" style="color:var(--color-ink-soft);">まだレビューがありません。</p>`;

    main.innerHTML = `
      <p class="breadcrumb">
        <a href="index.html">トップ</a><span class="sep">/</span>
        <a href="instructors.html">講師を探す</a><span class="sep">/</span>
        ${instructor.name}
      </p>

      <div class="detail-layout">
        <div>
          <div class="detail-header">
            <span class="detail-header__avatar">${instructor.initial}</span>
            <div>
              <h1 class="detail-header__name">${instructor.name}</h1>
              <div class="detail-header__meta">
                <span>${instructor.workArea}</span>
                <span>・</span>
                <span class="detail-header__rating">★ ${instructor.ratingAvg.toFixed(1)}</span>
                <span>（${instructor.reviewCount}件のレビュー）</span>
              </div>
            </div>
          </div>

          <div class="instructor-card__tags" style="margin-bottom:28px;">${tags}</div>

          <div class="detail-block">
            <h2 class="detail-block__title">自己紹介</h2>
            <p class="detail-block__text">${detail.bio || instructor.introduction}</p>
          </div>

          <div class="detail-block">
            <h2 class="detail-block__title">基本情報</h2>
            <dl class="info-list">
              <div><dt>対応形態</dt><dd>${instructor.workFormatLabel}</dd></div>
              <div><dt>経験年数</dt><dd>${instructor.yearsExperience}年</dd></div>
              <div><dt>保有資格</dt><dd>${detail.certifications || "-"}</dd></div>
              <div><dt>対応可能日程</dt><dd>${detail.availableSchedule || "要相談"}</dd></div>
            </dl>
          </div>

          <div class="detail-block">
            <h2 class="detail-block__title">レビュー（${reviews.length}件）</h2>
            ${reviewsHtml}
          </div>
        </div>

        <aside class="detail-sidebar">
          <div class="detail-sidebar__rate">${instructor.hourlyRateLabel}<span>／時間〜</span></div>
          <div class="detail-sidebar__divider"></div>
          <div class="detail-sidebar__row"><dt>対応形態</dt><dd>${instructor.workFormatLabel}</dd></div>
          <div class="detail-sidebar__row"><dt>対応エリア</dt><dd>${instructor.workArea}</dd></div>
          <div class="detail-sidebar__row"><dt>評価</dt><dd>★ ${instructor.ratingAvg.toFixed(1)}（${instructor.reviewCount}件）</dd></div>
          <button type="button" class="btn btn--primary btn--block" id="openRequestBtn">この講師に依頼する</button>
          <p class="detail-sidebar__note">依頼後、講師が確認して返信します</p>
        </aside>
      </div>
    `;

    document.getElementById("openRequestBtn").addEventListener("click", handleRequestClick);
  }

  /* --- 依頼ボタン押下時：ログイン状態で分岐 --- */
  function handleRequestClick() {
    const user = getCurrentUser();

    if (!user) {
      openModal("loginGateModal");
      return;
    }
    if (user.role === "INSTRUCTOR") {
      document.getElementById("loginGateTitle").textContent = "講師アカウントではご利用いただけません";
      document.getElementById("loginGateDesc").textContent = "研修の依頼は、企業または生徒アカウントでログインした場合のみ送信できます。";
      openModal("loginGateModal");
      return;
    }
    openModal("requestModal");
  }

  function openModal(id) { document.getElementById(id).classList.add("is-open"); }
  function closeModal(id) { document.getElementById(id).classList.remove("is-open"); }

  document.getElementById("closeRequestModal").addEventListener("click", () => closeModal("requestModal"));
  document.getElementById("closeLoginGate").addEventListener("click", () => closeModal("loginGateModal"));
  [document.getElementById("requestModal"), document.getElementById("loginGateModal")].forEach(overlay => {
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("is-open"); });
  });

  /* --- 依頼フォームの中身を組み立て --- */
  let subcategories = [];

  async function populateRequestForm() {
    const expertiseSelect = document.getElementById("reqExpertise");

    if (subcategories.length === 0) {
      const { data, error } = await supabaseClient
        .from("training_subcategories")
        .select("id, name, category_id, training_categories(name)")
        .order("name");
      if (!error) subcategories = data || [];
    }

    expertiseSelect.innerHTML = subcategories.length
      ? subcategories.map(s => `<option value="${s.id}">${s.training_categories?.name || ""} ／ ${s.name}</option>`).join("")
      : `<option value="">分野データを読み込めませんでした</option>`;

    const formatSelect = document.getElementById("reqFormat");
    formatSelect.innerHTML = `
      <option value="online">オンライン</option>
      <option value="offline">対面</option>
      <option value="both">オンライン・対面 両方</option>
    `;
    formatSelect.addEventListener("change", toggleLocationRequired);
    toggleLocationRequired();

    document.getElementById("requestModalDesc").textContent =
      `${instructor.name} 先生への依頼内容を入力してください。講師が確認後、承諾・見積り・却下のいずれかで返信します。`;
  }

  function toggleLocationRequired() {
    const format = document.getElementById("reqFormat").value;
    const locationField = document.getElementById("reqLocationField");
    locationField.style.display = format === "online" ? "none" : "block";
  }

  document.getElementById("requestForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!isRealId) {
      showToast("このプロフィールはサンプルデータのため、依頼を送信できません。");
      closeModal("requestModal");
      return;
    }

    const title = document.getElementById("reqTitle");
    const description = document.getElementById("reqDescription");
    const expertise = document.getElementById("reqExpertise");
    const format = document.getElementById("reqFormat").value;
    const locationInput = document.getElementById("reqLocation");

    let hasError = false;
    title.closest(".form-field").classList.toggle("has-error", !title.value.trim());
    description.closest(".form-field").classList.toggle("has-error", !description.value.trim());
    if (!title.value.trim() || !description.value.trim()) hasError = true;
    if (format !== "online" && !locationInput.value.trim()) hasError = true;

    document.getElementById("requestFormError").textContent =
      format !== "online" && !locationInput.value.trim()
        ? "対面の場合は実施場所の入力が必要です。"
        : "入力内容をご確認ください。";
    document.getElementById("requestFormError").classList.toggle("is-visible", hasError);
    if (hasError) return;

    const user = getCurrentUser();
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "送信中…";

    const { error } = await supabaseClient.from("training_requests").insert({
      requester_id: user.id,
      requester_type: user.role === "COMPANY" ? "company" : "individual",
      title: title.value.trim(),
      description: description.value.trim(),
      expertise_field: expertise.value,
      budget: Number(document.getElementById("reqBudget").value) || null,
      participant_count: Number(document.getElementById("reqParticipants").value) || null,
      preferred_format: format,
      location: format === "online" ? null : locationInput.value.trim(),
      preferred_schedule: document.getElementById("reqSchedule").value.trim() || null,
      target_instructor_id: instructor.id,
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "この内容で依頼を送る";

    if (error) {
      document.getElementById("requestFormError").textContent = `送信に失敗しました：${error.message}`;
      document.getElementById("requestFormError").classList.add("is-visible");
      return;
    }

    closeModal("requestModal");
    showToast(`${instructor.name} 先生へ依頼を送信しました（マイページから確認できます）`);
    document.getElementById("requestForm").reset();
  });

  (async () => {
    if (!authReady) {
      await new Promise(resolve => document.addEventListener("kenshulink:authchange", resolve, { once: true }));
    }
    const ok = await loadInstructorData();
    if (!ok) return;
    renderDetail();
    await populateRequestForm();
  })();
</script>
</body>
</html>
