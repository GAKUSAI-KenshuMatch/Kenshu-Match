<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィールを完成させる | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="complete-profile.html">

<div id="site-header"></div>

<main class="auth-page">
  <div class="auth-card">
    <p class="auth-card__eyebrow">ようこそ</p>
    <h1 class="auth-card__title">どちらの立場でご利用しますか？</h1>
    <p class="auth-card__desc">Googleアカウントでの初回ログインです。役割を選択して登録を完了してください。</p>

    <div class="notice-banner" id="profileError">入力内容をご確認ください。</div>

    <section id="roleStep">
      <div class="role-grid">
        <button type="button" class="role-card" data-role="INSTRUCTOR">
          <span class="hanko hanko--role" aria-hidden="true">講</span>
          <span class="role-card__name">研修講師</span>
          <span class="role-card__desc">研修サービスを提供する。プロフィールを公開して依頼を受ける。</span>
        </button>

        <button type="button" class="role-card" data-role="COMPANY">
          <span class="hanko hanko--role" aria-hidden="true">企</span>
          <span class="role-card__name">企業</span>
          <span class="role-card__desc">自社の研修ニーズに合う講師を探し、依頼を送る。</span>
        </button>

        <button type="button" class="role-card" data-role="INDIVIDUAL">
          <span class="hanko hanko--role" aria-hidden="true">生</span>
          <span class="role-card__name">生徒</span>
          <span class="role-card__desc">生徒として学びたい分野の講師を探し、依頼を送る。</span>
        </button>
      </div>
    </section>

    <form id="profileForm" novalidate style="margin-top:20px;">
      <div class="form-field">
        <label for="displayName" id="displayNameLabel">お名前</label>
        <input type="text" id="displayName" name="displayName" placeholder="山田 太郎" required>
        <p class="form-field__error">お名前を入力してください。</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn--block" id="completeBtn" disabled>この内容で登録を完了する</button>
      </div>
    </form>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  let selectedRole = null;

  const roleCards = document.querySelectorAll(".role-card");
  const completeBtn = document.getElementById("completeBtn");
  const displayNameInput = document.getElementById("displayName");

  roleCards.forEach(card => {
    card.addEventListener("click", () => {
      roleCards.forEach(c => c.classList.remove("is-selected"));
      card.classList.add("is-selected");
      selectedRole = card.dataset.role;
      completeBtn.disabled = false;
    });
  });

  /* --- Googleアカウントの表示名を初期値として入れておく --- */
  async function prefillName() {
    const { data } = await supabaseClient.auth.getUser();
    const meta = data?.user?.user_metadata || {};
    displayNameInput.value = meta.full_name || meta.name || "";
  }

  document.getElementById("profileForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBanner = document.getElementById("profileError");
    errorBanner.classList.remove("is-visible");

    const nameField = displayNameInput.closest(".form-field");
    const name = displayNameInput.value.trim();

    let hasError = false;
    nameField.classList.toggle("has-error", name.length === 0);
    if (name.length === 0) hasError = true;
    if (!selectedRole) hasError = true;

    if (hasError) {
      errorBanner.textContent = !selectedRole ? "役割を選択してください。" : "お名前を入力してください。";
      errorBanner.classList.add("is-visible");
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "登録中…";

    const { error } = await supabaseClient.rpc("complete_oauth_profile", {
      p_role: selectedRole,
      p_name: name,
    });

    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;

    if (error) {
      errorBanner.textContent = `登録に失敗しました：${error.message}`;
      errorBanner.classList.add("is-visible");
      return;
    }

    showToast("登録が完了しました");
    // needsProfileCompletion を再判定させるため、再度セッションを読み直す
    const { data: sessionData } = await supabaseClient.auth.getSession();
    await syncUserFromSession(sessionData?.session || null);
    setTimeout(() => { window.location.href = "mypage.html"; }, 600);
  });

  (async () => {
    if (!authReady) {
      await new Promise(resolve => document.addEventListener("kenshulink:authchange", resolve, { once: true }));
    }
    // すでにプロフィールが完成している（＝直接URLを叩いてこのページに来た）場合はマイページへ
    if (!needsProfileCompletion && getCurrentUser()) {
      window.location.href = "mypage.html";
      return;
    }
    // セッション自体が無い場合（未ログインで直接アクセス）はログインページへ
    if (!needsProfileCompletion && !getCurrentUser()) {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData?.session) {
        window.location.href = "login.html";
        return;
      }
    }
    await prefillName();
  })();
</script>
</body>
</html>
