<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="">

<div id="site-header"></div>

<main class="auth-page" style="min-height:auto; padding:56px 20px;">
  <div class="auth-card" style="max-width:560px;">
    <p class="auth-card__eyebrow">CONTACT</p>
    <h1 class="auth-card__title">お問い合わせ</h1>
    <p class="auth-card__desc">サービスに関するご質問・ご要望は、以下のフォームよりお気軽にご連絡ください。</p>

    <div class="notice-banner" id="contactError">送信に失敗しました。時間をおいて再度お試しください。</div>
    <div class="notice-banner" id="contactSuccess" style="background:#E1F6EE; color:#0F9C79;">
      お問い合わせを受け付けました。担当者よりご連絡いたします。
    </div>

    <form id="contactForm" novalidate>
      <div class="form-field">
        <label for="contactCompany">会社名</label>
        <input type="text" id="contactCompany" placeholder="株式会社サンプル">
      </div>

      <div class="form-field">
        <label for="contactName">お名前 <span style="color:var(--color-danger);">*</span></label>
        <input type="text" id="contactName" placeholder="山田 太郎" required>
        <p class="form-field__error">お名前を入力してください。</p>
      </div>

      <div class="form-field">
        <label for="contactEmail">メールアドレス <span style="color:var(--color-danger);">*</span></label>
        <input type="email" id="contactEmail" placeholder="example@company.co.jp" required>
        <p class="form-field__error">メールアドレスを正しく入力してください。</p>
      </div>

      <div class="form-field">
        <label for="contactType">お問い合わせ種別</label>
        <select id="contactType">
          <option value="service">サービスについて</option>
          <option value="instructor">講師登録について</option>
          <option value="business">企業・個人向け機能について</option>
          <option value="bug">不具合の報告</option>
          <option value="other">その他</option>
        </select>
      </div>

      <div class="form-field">
        <label for="contactMessage">お問い合わせ内容 <span style="color:var(--color-danger);">*</span></label>
        <textarea id="contactMessage" rows="5" placeholder="お問い合わせ内容をご記入ください。" required></textarea>
        <p class="form-field__error">お問い合わせ内容を入力してください。</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn--block">送信する</button>
      </div>
    </form>

    <p style="font-size:11.5px; color:var(--color-ink-soft); text-align:center; margin-top:16px;">
      ※ 現在このフォームはデモ表示のため、送信機能は実装されていません。
    </p>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  // ⚠️ 現時点では送信先（メール通知やDB保存）が未実装のため、フォームの見た目のみ用意しています。
  // 実際に問い合わせを受け取るには、以下のいずれかの実装が必要です：
  //   1. Supabase に "contact_messages" テーブルを作り、ここから insert する
  //   2. メール送信サービス（Resend等）と連携する Edge Function を呼び出す
  document.getElementById("contactForm").addEventListener("submit", (e) => {
    e.preventDefault();
    document.getElementById("contactError").classList.remove("is-visible");
    document.getElementById("contactSuccess").classList.remove("is-visible");

    const name = document.getElementById("contactName").value.trim();
    const email = document.getElementById("contactEmail").value.trim();
    const message = document.getElementById("contactMessage").value.trim();
    const company = document.getElementById("contactCompany").value.trim();
    const type = document.getElementById("contactType").value;

    if (!name || !email.includes("@") || !message) {
      document.getElementById("contactError").textContent = "入力内容をご確認ください。";
      document.getElementById("contactError").classList.add("is-visible");
      return;
    }

    // TODO: ここで実際の送信処理（Supabase insert または Edge Function 呼び出し）を行う
    console.log("お問い合わせ（未送信・実装待ち）:", { company, name, email, type, message });

    document.getElementById("contactSuccess").classList.add("is-visible");
    document.getElementById("contactForm").reset();
  });
</script>
</body>
</html>
