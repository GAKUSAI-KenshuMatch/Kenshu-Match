<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新しいパスワードを設定 | ケンシュウリンク</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-active-nav="login.html">

<div id="site-header"></div>

<main class="auth-page">
  <div class="auth-card">
    <p class="auth-card__eyebrow">RESET PASSWORD</p>
    <h1 class="auth-card__title">新しいパスワードを設定</h1>
    <p class="auth-card__desc" id="resetDesc">新しいパスワードを入力してください。</p>

    <div class="notice-banner" id="resetError">エラーが発生しました。</div>
    <div class="form-actions" id="resetErrorActions" style="display:none;">
      <a href="forgot-password.html" class="btn btn--primary btn--block">パスワード再設定を再リクエストする</a>
    </div>

    <form id="newPasswordForm" novalidate>
      <div class="form-field">
        <label for="newPassword">新しいパスワード</label>
        <div class="password-field">
          <input type="password" id="newPassword" name="password" placeholder="••••••••" required minlength="8">
          <button type="button" class="password-field__toggle" data-toggle-password="newPassword" aria-label="パスワードを表示">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
        <p class="form-field__error">8文字以上のパスワードを入力してください。</p>
      </div>

      <div class="form-field">
        <label for="confirmPassword">新しいパスワード（確認）</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required minlength="8">
          <button type="button" class="password-field__toggle" data-toggle-password="confirmPassword" aria-label="パスワードを表示">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
        <p class="form-field__error">パスワードが一致しません。</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn--primary btn--block">パスワードを更新する</button>
      </div>
    </form>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/layout.js"></script>
<script>
  // メール内のリンクから来た場合、Supabase が URL のハッシュ／クエリからトークンを読み取り
  // 自動的に「パスワード再設定用の一時セッション」を張る（PASSWORD_RECOVERY イベント）。
  let recoverySessionReady = false;

  const errorBanner = document.getElementById("resetError");
  const errorActions = document.getElementById("resetErrorActions");
  const passwordForm = document.getElementById("newPasswordForm");

  // パスワード表示・非表示の切り替え（目のアイコン）
  document.querySelectorAll("[data-toggle-password]").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.togglePassword);
      const isVisible = input.type === "text";
      input.type = isVisible ? "password" : "text";
      btn.classList.toggle("is-visible", !isVisible);
      btn.setAttribute("aria-label", isVisible ? "パスワードを表示" : "パスワードを非表示");
    });
  });

  function showLinkError(message) {
    errorBanner.textContent = message;
    errorBanner.classList.add("is-visible");
    errorActions.style.display = "";
    passwordForm.style.display = "none";
  }

  // リンクが期限切れ／無効な場合、Supabase は
  // #error=access_denied&error_code=otp_expired&error_description=... を URL に付与してこのページへ遷移させる。
  // フォーム送信を待たず、ページ読み込み時点でこれを検知してすぐにエラー表示する。
  (function checkUrlError() {
    const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const errorCode = hashParams.get("error_code");
    if (errorCode) {
      const message = errorCode === "otp_expired"
        ? "このリンクの有効期限が切れています。お手数ですが、もう一度パスワード再設定をリクエストしてください。"
        : "このリンクは無効です。お手数ですが、もう一度パスワード再設定をリクエストしてください。";
      showLinkError(message);
    }
  })();

  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      recoverySessionReady = true;
    }
  });

  // ページ読み込み時点で既にセッションが張られているケースにも対応
  (async () => {
    const { data } = await supabaseClient.auth.getSession();
    if (data?.session) recoverySessionReady = true;
  })();

  passwordForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const passwordField = document.getElementById("newPassword").closest(".form-field");
    const confirmField = document.getElementById("confirmPassword").closest(".form-field");
    const password = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    errorBanner.classList.remove("is-visible");

    let hasError = false;
    passwordField.classList.toggle("has-error", password.length < 8);
    confirmField.classList.toggle("has-error", password !== confirmPassword);
    if (password.length < 8 || password !== confirmPassword) hasError = true;
    if (hasError) return;

    if (!recoverySessionReady) {
      showLinkError("リンクの有効期限が切れているか、無効です。もう一度パスワード再設定をリクエストしてください。");
      return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = "更新中…";

    const { error } = await supabaseClient.auth.updateUser({ password });

    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;

    if (error) {
      errorBanner.textContent = `更新に失敗しました：${error.message}`;
      errorBanner.classList.add("is-visible");
      return;
    }

    showToast("パスワードを更新しました。ログインしてください。");
    await supabaseClient.auth.signOut();
    setTimeout(() => { window.location.href = "login.html"; }, 800);
  });
</script>
</body>
</html>
